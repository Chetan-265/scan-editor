<style>

const TOL=[40,70,100,140];
$('ibg').onclick=()=>{

$('idel').onclick=()=>{
  if(!im)return;

  }catch(err){st('Could not open that image: '+err.message)}
};
const O=p=>p.objs||(p.objs=[]);
const cloneObjs=p=>O(p).map(o=>({...o,a:o.a&&{...o.a},b:o.b&&{...o.b},pts:o.pts&&o.pts.map(q=>({...q}))}));
function drawObj(c,p,o){if(o.k==='image')c.drawImage(o.src,o.x0,o.y0,o.x1-o.x0,o.y1-o.y0);else render(c,p,o.k,o.a,o.b,o.pts,false,o)}
function bbox(o){
  if(o.k==='image')return{x0:o.x0,y0:o.y0,x1:o.x1,y1:o.y1};
  const P=o.k==='pen'&&o.pts.length?o.pts:[o.a,o.b],X=P.map(q=>q.x),Y=P.map(q=>q.y);
  return{x0:Math.min(...X),y0:Math.min(...Y),x1:Math.max(...X),y1:Math.max(...Y)};
}
function hitObj(o,q){
  const t=hsize()*1.2,B=bbox(o);
  if(o.k==='line'||o.k==='arr'||o.k==='pen'){
    const P=o.k==='pen'?o.pts:[o.a,o.b];
    for(let i=0;i<Math.max(1,P.length-1);i++){
      const a=P[i],b=P[i+1]||a,dx=b.x-a.x,dy=b.y-a.y,u=Math.max(0,Math.min(1,((q.x-a.x)*dx+(q.y-a.y)*dy)/(dx*dx+dy*dy||1)));
      if(Math.hypot(q.x-a.x-u*dx,q.y-a.y-u*dy)<t)return true;
    }
    return false;
  }
  const m=o.k==='rect'||o.k==='ell'?t:0;
  return q.x>=B.x0-m&&q.x<=B.x1+m&&q.y>=B.y0-m&&q.y<=B.y1+m;
}
const cloneGeo=o=>({a:o.a&&{...o.a},b:o.b&&{...o.b},pts:o.pts?o.pts.map(q=>({...q})):[],x0:o.x0,y0:o.y0,x1:o.x1,y1:o.y1});
function setGeo(o,g,fn){
  if(o.k==='image'){const A=fn(g.x0,g.y0),C=fn(g.x1,g.y1);o.x0=A.x;o.y0=A.y;o.x1=C.x;o.y1=C.y;return}
  const m=q=>fn(q.x,q.y);o.a=m(g.a);o.b=m(g.b);if(g.pts.length)o.pts=g.pts.map(m);
}
function loadObj(o){if(o.col)$('col').value=o.col;if(o.wid)$('wid').value=String(o.wid)}
function selDown(e){
  const p=pages[cur],q=pt(e);if(!p)return;
  if(so){
    const B=bbox(so),h=hsize(),i=[[B.x0,B.y0],[B.x1,B.y0],[B.x0,B.y1],[B.x1,B.y1]].findIndex(([x,y])=>Math.hypot(x-q.x,y-q.y)<h*1.5);
    if(i>=0){snap(p);drag={t:'or',i,B,o:cloneGeo(so)};view.setPointerCapture(e.pointerId);e.preventDefault();return}
  }
  so=[...O(p)].reverse().find(o=>hitObj(o,q))||null;
  if(so){loadObj(so);snap(p);drag={t:'om',a:q,B:bbox(so),o:cloneGeo(so)};view.setPointerCapture(e.pointerId);e.preventDefault()}
  show();
}
function objDrag(q){
  const o=so,d=drag,g=d.o,B=d.B;if(!o)return;
  if(d.t==='om'){const dx=q.x-d.a.x,dy=q.y-d.a.y;setGeo(o,g,(x,y)=>({x:x+dx,y:y+dy}))}
  else{
    const w0=B.x1-B.x0||1,h0=B.y1-B.y0||1,f=[[B.x1,B.y1],[B.x0,B.y1],[B.x1,B.y0],[B.x0,B.y0]][d.i];
    let x0=Math.min(f[0],q.x),x1=Math.max(f[0],q.x),y0=Math.min(f[1],q.y),y1=Math.max(f[1],q.y);

    const sx=(x1-x0)/w0,sy=(y1-y0)/h0;
    setGeo(o,g,(x,y)=>({x:x0+(x-B.x0)*sx,y:y0+(y-B.y0)*sy}));
  }
  show();
}
$('col').addEventListener('input',()=>{if(tool==='select'&&so&&so.col!==undefined){so.col=$('col').value;show()}});

let zoom=1;
function setZoom(z){zoom=Math.min(3,Math.max(.5,z));view.style.width=zoom*100+'%';show();st('Zoom '+Math.round(zoom*100)+'%. Switch off the active tool to scroll a zoomed page by touch.')}

$('pdelpg').onclick=()=>{

function rotate(dir){
  const p=pages[cur];if(!p)return;
  p.cv=flat(p);p.objs=[];const o=p.cv,n=document.createElement('canvas');n.width=o.height;n.height=o.width;
  const c=n.getContext('2d');c.translate(n.width/2,n.height/2);c.rotate(dir*Math.PI/2);c.drawImage(o,-o.width/2,-o.height/2);

$('save').onclick=async()=>{
  if(!pages.length)return st('Open a file first.');
  st('Building PDF…');
  try{
    const {PDFDocument,StandardFonts}=PDFLib,doc=await PDFDocument.create(),f=await doc.embedFont(StandardFonts.Helvetica);
    for(const p of pages){
      const W=p.cv.width/p.s,H=p.cv.height/p.s,pg=doc.addPage([W,H]);
      pg.drawImage(await doc.embedJpg(flat(p).toDataURL('image/jpeg',.92)),{x:0,y:0,width:W,height:H});
      for(const w of p.words.filter(x=>x.text)){
        try{pg.drawText(w.text,{x:w.x0/p.s,y:H-w.y1/p.s,size:Math.max(4,(w.y1-w.y0)/p.s*.85),font:f,opacity:0})}catch(e){}
        if(w.url){try{const cx=doc.context,an=cx.obj({Type:'Annot',Subtype:'Link',Rect:[w.x0/p.s,H-w.y1/p.s,w.x1/p.s,H-w.y0/p.s],Border:[0,0,0],A:{Type:'Action',S:'URI',URI:PDFLib.PDFString.of(w.url)}});pg.node.addAnnot(cx.register(an))}catch(e){}}

    }

    document.body.appendChild(a);a.click();a.remove();st('Saved. The PDF keeps the original look and has a selectable, searchable text layer.');
  }catch(err){st('Could not save: '+err.message)}
};
